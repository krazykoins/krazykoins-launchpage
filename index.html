<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Krazy Koins – Every Coin Has a Story</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      min-height: 100vh;
    }

    .container {
      max-width: 700px;
      padding: 40px 20px;
    }

    .logo {
      width: 100%;
      max-width: 350px;
      margin: 0 auto 30px;
      display: block;
    }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .notify-box {
      margin-top: 30px;
    }

    input[type="email"] {
      padding: 12px;
      width: 80%;
      max-width: 300px;
      border-radius: 4px;
      border: none;
      margin-bottom: 10px;
      font-size: 1rem;
    }

    button {
      padding: 12px 24px;
      background: #e0b04f;
      color: #111;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button:hover {
      background: #f2c76a;
    }

    .footer {
      margin-top: 40px;
      font-size: 0.9rem;
      opacity: 0.7;
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- Replace this src with your actual logo file path -->
    <img src="img/krazykoins-logo.png" alt="Krazy Koins Logo" class="logo" />

    <h1>Krazy Koins</h1>
    <p>Every Coin Has a Story.<br>
       Discover rare, unusual, and mysterious coins found in the wild.</p>

    <!-- Launchpage email notify component -->
    <div class="notify-box">
      <form action="https://launchpage.xyz/api/notify" method="POST">
        <input type="hidden" name="site" value="krazykoins.com">
        <input type="email" name="email" placeholder="Enter your email to get updates" required />
        <br />
        <button type="submit">Notify Me</button>
      </form>
    </div>

    <div class="footer">
      © 2026 Krazy Koins — All Rights Reserved
    </div>

  </div>
</body>
</html>
